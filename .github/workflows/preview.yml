name: Preview Build
on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-preview:
    name: Build & Preview Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Code Analysis (Detekt)
        run: ./gradlew detekt --no-daemon

      - name: Get Current Version
        run: |
          COMMIT_COUNT=$(($(git rev-list --count HEAD) + 981))
          TAG="r$COMMIT_COUNT"
          VERSION_NAME="0.5.78"
          VERSION_CODE=$((578 + COMMIT_COUNT))
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Generate AI Context
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            RANGE="origin/${{ github.event.pull_request.base.ref }}..HEAD"
          elif [ "${{ github.event_name }}" == "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          
          echo "Context Range: $RANGE"
          
          mkdir -p .github/ai
          # Save context to files instead of environment variables to prevent "Argument list too long"
          git log --pretty=format:"- %s" $RANGE > .github/ai/commits.txt || echo "New preview build" > .github/ai/commits.txt
          git diff --stat $RANGE > .github/ai/files.txt || echo "" > .github/ai/files.txt
          # Capture a very small amount of code to stay under Groq TPM limits (12k tokens)
          git diff -U1 $RANGE | head -n 200 > .github/ai/diff.txt || echo "" > .github/ai/diff.txt

      - name: Restore AI Note Accumulator
        uses: actions/cache/restore@v4
        with:
          path: .github/AI_NOTE_ACCUMULATOR
          key: ai-note-acc-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-note-acc-${{ github.ref_name }}-

      - name: Generate Changelog with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ACCUMULATED_NOTES=""
          if [ -f .github/AI_NOTE_ACCUMULATOR ]; then
            ACCUMULATED_NOTES=$(cat .github/AI_NOTE_ACCUMULATOR)
          fi
          
          COMMITS=$(cat .github/ai/commits.txt)
          FILES=$(cat .github/ai/files.txt)
          DIFF=$(cat .github/ai/diff.txt)

          cat > .github/ai/full_prompt.txt <<EOF
          You are an excited team member of AniZen! Write a friendly and hyped 'Changelog' for our fans. 
          Summarize WHAT IS NEW and WHAT CHANGED.
          Use emojis like 🚀, ✨, and 🛠️. Group into 'What's New', 'Fixed', and 'Polished'.
          CRITICAL: Do NOT mention technical details like 'diffs', 'commits', or file paths. Focus on user-facing features!
          
          Your primary job is to summarize the NEW CHANGES.
          However, if there are PREVIOUS FAILED BUILD NOTES below, you MUST ALSO include that information, as those changes are also part of this release but were never announced. 
          Merge them seamlessly into one unified changelog.

          PREVIOUS FAILED BUILD NOTES (Include these):
          $ACCUMULATED_NOTES

          NEW CHANGES (Primary focus):
          COMMITS:
          $COMMITS
          
          FILE STATS:
          $FILES
          
          DIFF SNIPPET:
          $DIFF
          EOF
          
          PAYLOAD=$(jq -n \
            --rawfile prompt .github/ai/full_prompt.txt \
            '{
              contents: [{parts: [{text: $prompt}]}],
              generationConfig: {temperature: 0.7, maxOutputTokens: 1024}
            }')
          
          echo "Requesting AI summary from Gemini (gemini-flash-latest)..."
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          
          # Fallback to gemini-flash-lite-latest if primary fails or is empty
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
            echo "Primary model failed or empty. Requesting fallback from Gemini (gemini-flash-lite-latest)..."
            RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          fi
          
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
            SUMMARY="We've implemented fresh UI refinements and optimized the engine for a better experience! ✨"
          fi
          
          echo "AI_CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          mkdir -p .github && echo "$SUMMARY" > .github/AI_NOTE_ACCUMULATOR

      - name: Build Preview APK
        run: ./gradlew assemblePreview -Pinclude-telemetry=false -Penable-updater=true --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename & Filter APKs
        run: |
          cd app/build/outputs/apk/preview/
          for f in *.apk; do
            if [[ "$f" == *"universal"* ]]; then
              mv "$f" "AniZen-Preview-${{ env.TAG }}-universal.apk"
            elif [[ "$f" == *"arm64-v8a"* ]]; then
              mv "$f" "AniZen-Preview-${{ env.TAG }}-arm64-v8a.apk"
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              mv "$f" "AniZen-Preview-${{ env.TAG }}-armeabi-v7a.apk"
            elif [[ "$f" == *"x86_64"* ]]; then
              mv "$f" "AniZen-Preview-${{ env.TAG }}-x86_64.apk"
            elif [[ "$f" == *"x86"* ]]; then
              mv "$f" "AniZen-Preview-${{ env.TAG }}-x86.apk"
            else
              rm -f "$f"
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-Preview-${{ env.TAG }}
          path: app/build/outputs/apk/preview/*.apk

      - name: Reset Accumulator on Success
        if: success()
        run: mkdir -p .github && echo "" > .github/AI_NOTE_ACCUMULATOR

      - name: Persist Accumulator
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/AI_NOTE_ACCUMULATOR
          key: ai-note-acc-${{ github.ref_name }}-${{ github.run_id }}

      - name: Create Release in Preview Repo
        uses: softprops/action-gh-release@v1
        with:
          repository: salmanbappi/anizen-preview
          token: ${{ secrets.GH_PAT || github.token }}
          tag_name: ${{ env.TAG }}
          name: AniZen Preview ${{ env.TAG }}
          body: |
            ### 🌟 AniZen Preview Release (${{ env.TAG }})
            
            ${{ env.AI_CHANGELOG }}
            
            ---
            **Version**: ${{ env.VERSION_NAME }}
            **Revision**: ${{ env.COMMIT_COUNT }}
            **Branch**: `preview`
          files: app/build/outputs/apk/preview/*.apk
          prerelease: false
          generate_release_notes: false

      - name: Send Log to Discord
        if: success()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          # Define clean links for Markdown
          RELEASE_URL="https://github.com/salmanbappi/anizen-preview/releases/tag/${{ env.TAG }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          
          EMBED_TITLE="🛠️ Preview Build Update (${{ env.TAG }})"
          EMBED_DESC=$(cat <<EOF
          ${{ env.AI_CHANGELOG }}

          ---
          **📥 [Download Preview APK]($RELEASE_URL)**
          **🔗 [View Commit Details]($COMMIT_URL)**
          EOF
          )

          # Encode using jq for a clean Discord Embed payload
          PAYLOAD=$(jq -n \
            --arg title "$EMBED_TITLE" \
            --arg desc "$EMBED_DESC" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 5814783
              }]
            }')
          
          curl -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               https://discord.com/api/v10/channels/1482262233227464714/messages
