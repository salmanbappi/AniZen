name: Compilar APK

# Compila un APK instalable en tu propio fork, sin necesitar los secretos del autor original.
# Se ejecuta a mano: pestaña Actions > "Compilar APK" > Run workflow.
# La llave de firma es siempre la misma, así cada versión nueva se instala encima de la anterior
# sin borrar tu biblioteca.

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar la llave de firma (fija)
        run: |
          rm -f app/anizen.jks
          echo "" | base64 -d > app/anizen.jks

      - name: Compilar el APK
        run: ./gradlew assemblePreview -Pinclude-telemetry=false -Penable-updater=false -PabiList=arm64-v8a --no-daemon
        env:
          SIGNING_STORE_PASSWORD: anizen123
          SIGNING_KEY_ALIAS: meikan
          SIGNING_KEY_PASSWORD: anizen123

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-APK
          path: app/build/outputs/apk/preview/*.apk
          retention-days: 14
